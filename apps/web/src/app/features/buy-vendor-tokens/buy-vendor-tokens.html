<div class="buy-vendor-tokens">
  <div class="buy-vendor-tokens--code">
    <app-buy-vendor-token-vendor [formField]="payForm.vendor">
      <app-buy-vendor-token-promo-code
        [formField]="payForm.promoCode"
      ></app-buy-vendor-token-promo-code>
    </app-buy-vendor-token-vendor>
  </div>
  <div class="buy-vendor-tokens--data">
    <app-buy-vendor-token-login-input
      class="col-5"
      [formField]="payForm.login"
    ></app-buy-vendor-token-login-input>
    <app-buy-vendor-token-money-input
      class="col-7"
      [formField]="payForm.money"
      (currencyChanged)="onCurrencyChanged($event)"
    ></app-buy-vendor-token-money-input>
  </div>
  <div class="buy-vendor-tokens--action">
    <button
      type="button"
      class="buy-vendor-tokens--action__button"
      aria-label="Оплатить"
    >
      <span>Оплатить {{ paymentSum() }}</span>
      @if (currentCurrency(); as currency) {
      <mat-icon aria-hidden="true" [svgIcon]="currency.icon"></mat-icon>
      }
    </button>
  </div>
</div>
