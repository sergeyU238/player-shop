<div class="buy-vendor-token-promo-code">
  <div class="buy-vendor-token-promo-code__logo">
    <img
      [ngSrc]="`/assets/vendor-icons/steam.svg`"
      [width]="76"
      [height]="76"
      alt="Steam"
    />
  </div>
  <div class="buy-vendor-token-promo-code__promo-wrapper">
    <div class="buy-vendor-token-promo-code__promo-wrapper--title">
      <div>Пополнение Steam</div>
      <div class="buy-vendor-token-promo-code__promo-wrapper--title-persentage">
        5%
      </div>
    </div>
    <div class="buy-vendor-token-promo-code__promo-wrapper--code">
      <button>
        <span>Ввести промо код</span>
        <mat-icon svgIcon="down"></mat-icon>
      </button>
    </div>
  </div>
</div>
