<div class="buy-product">
  <app-product
    class="buy-product__left-col"
    [product]="product()"
  ></app-product>

  <div class="buy-product__right-col">
    @if (isPaymentError()) {
    <div class="buy-product__right-col--payment-error">
      Во время платежа произошла ошибка
    </div>
    }
    <app-buy-product-form
      [product]="product()"
      (buyProductAction)="buyProduct($event)"
    ></app-buy-product-form>
  </div>
</div>
