<mat-card class="product" appearance="outlined">
  <img
    mat-card-image
    [src]="`/products/${product().image}`"
    [alt]="product().name"
  />
  <mat-card-content>
    <div class="product__title">{{ product().name }}</div>
    <ng-content select="extra-description"></ng-content>
  </mat-card-content>
  <mat-card-actions>
    <ng-content></ng-content>
  </mat-card-actions>
</mat-card>
