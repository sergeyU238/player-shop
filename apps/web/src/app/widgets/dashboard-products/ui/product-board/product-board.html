<div class="product-board">
  <div class="product-board__header">
    <div class="product-board__header--title">{{ title() }}</div>
    <div class="product-board__header--actions">
      <ng-content></ng-content>
    </div>
  </div>
  <div class="product-board__list">
    @for(item of list(); track item.id) {
    <app-product class="product-board__list--list-item" [product]="item">
      <ng-container ngProjectAs="extra-description">
        <div class="product-board__list--price-wrapper">
          <div class="price">
            {{ item.price }}
            <mat-icon
              [svgIcon]="currencyList[item.currencyCode].icon"
            ></mat-icon>
          </div>
          <div class="old-price">
            {{ +item.price + 1000 }}
            <mat-icon
              [svgIcon]="currencyList[item.currencyCode].icon"
            ></mat-icon>
          </div>
        </div>
      </ng-container>
      <button
        class="product-board__list--pay-button"
        matButton="outlined"
        (click)="buyProduct(item.id)"
      >
        Купить
      </button>
    </app-product>
    }
  </div>
</div>
